services:
  # Nom de service explicite : Compose l'enregistre comme alias DNS sur chaque
  # reseau rejoint. Un service nomme 'web' sur le reseau partage figutab_default
  # entrait en collision avec le 'web' du projet figutab (reverse_proxy web:80).
  kraftflopedt-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: kraftflopedt-web
    restart: unless-stopped
    depends_on:
      - kraftflopedt-adapter
    ports:
      - "127.0.0.1:8093:80"
    # wget de busybox est present dans nginx:alpine ; un nginx qui ne sert plus
    # index.html passe en unhealthy (visible dans docker ps et le panel).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  kraftflopedt-adapter:
    build:
      context: .
      dockerfile: Dockerfile.adapter
    container_name: kraftflopedt-adapter
    restart: unless-stopped
    environment:
      - PORT=3001
      # Store local FlOpEDT (voir store.js) : emplois du temps toutes les heures,
      # groupes/contraintes/salles toutes les semaines, 3 s entre deux appels.
      - DEPTS=INFO,RT,CS,GIM
      - REFRESH_COURSES_MS=3600000
      - REFRESH_STATIC_MS=604800000
      - MIN_GAP_MS=3000
      - WEEKS_BEHIND=2
    volumes:
      - kraftflopedt-adapter-data:/data
    ports:
      - "127.0.0.1:8094:3001"
    # /status repond depuis la memoire sans toucher FlOpEDT : un adapter bloque
    # (boucle d'evenements figee, port ferme) est detecte en 3 minutes.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/status"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  # Donnees FlOpEDT stockees en local : survivent aux redeploiements
  kraftflopedt-adapter-data:
