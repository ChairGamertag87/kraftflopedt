# ══════════════════════════════════════════════════
#  KraftFlopEDT — nginx config
#  Place in /etc/nginx/sites-available/kraftflopedt
#
#  Everything on one domain: kraftflopedt.habibiserver.dev
#    /                  → static site
#    /courses           → adapter.js (Node, port 3001)
#    /groups            → adapter.js
#    /free-rooms        → adapter.js
#    /current-week      → adapter.js
#    /docs              → adapter.js (Scalar UI)
#    /openapi.json      → adapter.js
#    /flopedt/          → proxy to flopedt.iut-blagnac.fr
# ══════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name kraftflopedt.habibiserver.dev;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kraftflopedt.habibiserver.dev;

    ssl_certificate     /etc/letsencrypt/live/kraftflopedt.habibiserver.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kraftflopedt.habibiserver.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/kraftflopedt;
    index index.html;

    # ── API adapter routes → adapter.js on port 3001 ──
    location ~ ^/(courses|groups|free-rooms|current-week|docs|openapi\.json)(/.*)?$ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept" always;

        proxy_read_timeout    30s;
        proxy_connect_timeout 10s;
    }

    # ── Proxy to FlOpEDT (used by the static site's api.js) ──
    location /flopedt/ {
        proxy_pass         https://flopedt.iut-blagnac.fr/;
        proxy_ssl_server_name on;

        proxy_set_header Host       flopedt.iut-blagnac.fr;
        proxy_set_header Referer    https://flopedt.iut-blagnac.fr/;
        proxy_set_header Origin     https://flopedt.iut-blagnac.fr;
        proxy_set_header Accept     application/json;
        proxy_set_header User-Agent "Mozilla/5.0 (KraftFlopEDT-Proxy/1.0)";

        proxy_buffering off;

        add_header Access-Control-Allow-Origin  * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Accept" always;
    }

    # ── Static site (catch-all) ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ──
    location ~* \.(css|js|svg|ico|png|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/kraftflopedt.access.log;
    error_log  /var/log/nginx/kraftflopedt.error.log;
}
