# Statique KraftFlopEDT — TLS et routage API geres par le reverse proxy Caddy devant.
# (les routes /courses, /groups, /free-rooms, /current-week, /docs, /openapi.json
#  sont aiguillees par Caddy vers l'adapter, pas ici)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML (et fichiers non versionnes) : toujours revalider aupres du serveur.
    # nginx renvoie un 304 via ETag/Last-Modified, le navigateur et Cloudflare
    # ne peuvent donc pas garder un index.html perime.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy CORS restreint vers FlOpEDT (utilise par js/api.js) ──
    # Seuls les 4 endpoints publics dont le site a besoin, en GET uniquement.
    # Les cookies et l'Authorization du visiteur ne sont jamais transmis.
    # Remplace l'ancien handle_path /flopedt/* de Caddy qui relayait n'importe
    # quel chemin et n'importe quelle methode vers flopedt.iut-blagnac.fr.
    location ~ ^/api/flopedt/fr/api/(fetch/scheduledcourses|fetch/constraints|groups/structural/tree|rooms/all)/$ {
        limit_except GET { deny all; }

        # DNS Docker + variable : l'upstream est re-resolu, pas fige au demarrage
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $flopedt "https://flopedt.iut-blagnac.fr";
        rewrite ^/api/flopedt(/.*)$ $1 break;
        proxy_pass $flopedt;

        proxy_ssl_server_name on;
        proxy_ssl_name        flopedt.iut-blagnac.fr;
        proxy_set_header Host          flopedt.iut-blagnac.fr;
        proxy_set_header Accept        application/json;
        proxy_set_header User-Agent    "KraftFlopEDT-Proxy/1.0";
        proxy_set_header Cookie        "";
        proxy_set_header Authorization "";
        proxy_set_header Referer       "";
        proxy_set_header Origin        "";

        # rooms/all met parfois plus de 30 s cote FlOpEDT
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;

        add_header Cache-Control "no-store";
    }

    # Tout autre chemin sous /api/ : 404 explicite, pas de fallback SPA
    location /api/ {
        return 404;
    }

    # Assets : references depuis index.html avec ?v=<hash du contenu>
    # (voir Dockerfile.web). Une nouvelle version = une nouvelle URL,
    # le cache long est donc sans risque.
    location ~* \.(css|js|svg|ico|png|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
