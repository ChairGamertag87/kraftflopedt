# Statique KraftFlopEDT — TLS et routage API geres par le reverse proxy Caddy devant.
# (les routes /courses, /groups, /free-rooms, /current-week, /docs, /openapi.json
#  sont aiguillees par Caddy vers l'adapter, pas ici)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # HTML (et fichiers non versionnes) : toujours revalider aupres du serveur.
    # nginx renvoie un 304 via ETag/Last-Modified, le navigateur et Cloudflare
    # ne peuvent donc pas garder un index.html perime.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ── Endpoints FlOpEDT utilises par js/api.js : servis par l'adapter ──
    # L'adapter garde tout en local (store.js) et ne parle a FlOpEDT qu'en tache
    # de fond : le visiteur n'attend plus jamais flopedt.iut-blagnac.fr.
    # Seuls les 4 endpoints publics dont le site a besoin, en GET uniquement.
    location ~ ^/api/flopedt/fr/api/(fetch/scheduledcourses|fetch/constraints|groups/structural/tree|rooms/all)/$ {
        limit_except GET { deny all; }

        # DNS Docker + variable : l'upstream est re-resolu, pas fige au demarrage
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $adapter "http://kraftflopedt-adapter:3001";
        proxy_pass $adapter;

        proxy_set_header Host          $host;
        proxy_set_header Cookie        "";
        proxy_set_header Authorization "";

        # Une donnee jamais vue est telechargee a la demande : FlOpEDT peut etre lent
        proxy_connect_timeout 5s;
        proxy_read_timeout    90s;
    }

    # Etat du store de l'adapter (dernier rafraichissement, erreurs FlOpEDT...)
    location = /api/status {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $adapter "http://kraftflopedt-adapter:3001";
        rewrite ^ /status break;
        proxy_pass $adapter;
        add_header Cache-Control "no-store";
    }

    # Tout autre chemin sous /api/ : 404 explicite, pas de fallback SPA
    location /api/ {
        return 404;
    }

    # Assets : references depuis index.html avec ?v=<hash du contenu>
    # (voir Dockerfile.web). Une nouvelle version = une nouvelle URL,
    # le cache long est donc sans risque.
    location ~* \.(css|js|svg|ico|png|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
