# Statique KraftFlopEDT — TLS et routage API geres par le reverse proxy Caddy devant.
# (les routes /courses, /groups, /free-rooms, /current-week, /docs, /openapi.json
#  et le proxy /flopedt/ sont aiguilles par Caddy, pas ici)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|ico|png|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
