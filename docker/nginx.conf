# Statique KraftFlopEDT — TLS gere par le reverse proxy Caddy devant, qui relaie
# tout vers ce nginx. Seuls /api/* et /ical/* (ci-dessous) atteignent l'adapter :
# ses autres routes (/courses, /groups, /free-rooms, /current-week, /docs,
# /openapi.json) ne sont joignables que depuis l'hote (127.0.0.1:8094) et rendent
# index.html en prod via le fallback SPA.

# Les healthchecks (wget de busybox toutes les 60 s, voir docker-compose.yml)
# faisaient 70 a 80 % des lignes du journal d'acces.
map $http_user_agent $loggable {
    default 1;
    ~^Wget 0;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log main if=$loggable;

    root /usr/share/nginx/html;
    index index.html;
    # Pas de version nginx dans Server ni les pages d'erreur ; une redirection
    # /css -> /css/ reste relative (sinon http://kraftflopedt-web/css/ derriere Caddy)
    server_tokens off;
    absolute_redirect off;

    # En-tetes de securite (HSTS, CSP...) : voir security-headers.inc, repris
    # dans chaque location qui declare son propre add_header.
    include /etc/nginx/conf.d/security-headers.inc;

    # HTML (et fichiers non versionnes) : toujours revalider aupres du serveur.
    # nginx renvoie un 304 via ETag/Last-Modified, le navigateur et Cloudflare
    # ne peuvent donc pas garder un index.html perime.
    # Pas de fallback SPA : un chemin inconnu est un vrai 404 (index.html est
    # servi par la directive index pour /), sinon Google indexait n'importe quoi en 200
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # ── Endpoints FlOpEDT utilises par js/api.js : servis par l'adapter ──
    # L'adapter garde tout en local (store.js) et ne parle a FlOpEDT qu'en tache
    # de fond : le visiteur n'attend plus jamais flopedt.iut-blagnac.fr.
    # Seuls les 4 endpoints publics dont le site a besoin, en GET uniquement.
    location ~ ^/api/flopedt/fr/api/(fetch/scheduledcourses|fetch/constraints|groups/structural/tree|rooms/all)/$ {
        limit_except GET HEAD { deny all; }

        # DNS Docker + variable : l'upstream est re-resolu, pas fige au demarrage
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $adapter "http://kraftflopedt-adapter:3001";
        proxy_pass $adapter;

        proxy_set_header Host          $host;
        proxy_set_header Cookie        "";
        proxy_set_header Authorization "";

        # Une donnee jamais vue est telechargee a la demande : FlOpEDT peut etre lent
        proxy_connect_timeout 5s;
        proxy_read_timeout    90s;
    }

    # Etat du store de l'adapter (dernier rafraichissement, erreurs FlOpEDT...)
    location = /api/status {
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $adapter "http://kraftflopedt-adapter:3001";
        rewrite ^ /status break;
        proxy_pass $adapter;
        # un seul Cache-Control : celui de l'adapter est masque, sinon les deux
        # partaient (public, max-age=300 puis no-store)
        proxy_hide_header Cache-Control;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    # Menus du Resto U' Blagnac : l'adapter garde le flux CNOUS en cache (HTTP
    # seul, impossible a appeler depuis une page HTTPS) et le sert normalise.
    location = /api/crous/menu {
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $adapter "http://kraftflopedt-adapter:3001";
        rewrite ^ /crous/menu break;
        proxy_pass $adapter;
        proxy_set_header Cookie        "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_hide_header Cache-Control;
        include /etc/nginx/conf.d/security-headers.inc;
        # Les jours passes sont retires a la generation : 10 min de cache
        # faisaient revoir le menu de la veille jusqu'a 00h10
        add_header Cache-Control "public, max-age=60";
    }

    # Flux iCalendar generes par l'adapter depuis son store (jamais FlOpEDT en direct)
    location /ical/ {
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $adapter "http://kraftflopedt-adapter:3001";
        proxy_pass $adapter;
        proxy_set_header Host          $host;
        proxy_set_header Cookie        "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Tout autre chemin sous /api/ : 404 explicite, pas de fallback SPA
    location /api/ {
        return 404;
    }

    # Assets : references depuis index.html avec ?v=<hash du contenu>
    # (voir Dockerfile.web). Une nouvelle version = une nouvelle URL,
    # le cache long est donc sans risque.
    location ~* \.(css|js|svg|ico|png|woff2?)$ {
        try_files $uri =404;
        # Un seul Cache-Control (expires en ajoutait un second, max-age=604800, a cote de celui-ci)
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
